name: Android release build
on:
  workflow_call:
    inputs:
      source_ref:
        type: string
        default: ''
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Prepare pinned Android dependencies
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          python - <<'PY'
          import hashlib, json, pathlib, urllib.request
          lock = json.loads(pathlib.Path('scripts/android-tools-lock.json').read_text())['zxing']
          target = pathlib.Path('.tmp/mobile-tools/zxing-core-3.5.3.jar')
          target.parent.mkdir(parents=True, exist_ok=True)
          with urllib.request.urlopen(lock['url'], timeout=60) as response:
              data = response.read()
          assert hashlib.sha256(data).hexdigest() == lock['sha256'], 'ZXing checksum mismatch'
          target.write_bytes(data)
          PY
      - name: Restore existing Android signing identity
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python - <<'PY'
          import base64, os, pathlib
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'release.p12'
          target.write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'], validate=True))
          target.chmod(0o600)
          PY
      - name: Build and verify signed Android APK
        env:
          CMB_ANDROID_SDK: ${{ env.ANDROID_HOME }}
          CMB_ANDROID_JAVA_HOME: ${{ env.JAVA_HOME }}
          CMB_ANDROID_KEYSTORE: ${{ runner.temp }}/release.p12
          CMB_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: python scripts/build-mobile-android.py --output-dir dist/release
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-Android
          if-no-files-found: error
          path: dist/release/*-Android.apk
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"
